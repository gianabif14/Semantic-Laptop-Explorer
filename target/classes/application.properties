spring.application.name=semantic-laptop-web
app.ontology.path=ontology/ontologi_laptop.ttl

# Konfigurasi Port Dinamis (Fallback otomatis mulai dari 8080 -> 8081 -> ... -> 8180)
app.server.preferred-port=${PORT:8080}
app.server.max-port=8180

# Buka browser otomatis saat server siap (ubah ke false jika tidak diinginkan)
app.browser.auto-open=true

# Menyembunyikan log verbose yang tidak perlu agar output URL lebih bersih
logging.level.root=WARN
logging.level.id.ac.semanticlaptop=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
